name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('.github/workflows/build.yml') }}

      - name: Check (devtools)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cargo clippy --workspace --locked --features devtools -- -D warnings

      - name: Build release
        run: cargo build --release --workspace --locked

      # The tag is the release contract: v0.1.0 (or the short form v0.1) must match Cargo.toml,
      # otherwise the updater would advertise a version the binary does not carry.
      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                  Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw "Release tag must start with 'v': $tag" }
          $version = $tag.Substring(1)
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "Release tag must look like v1.2.3 or v1.2: $tag"
          }
          $parts = $version.Split('.')
          if ($parts.Count -eq 2) { $version = "$version.0" }
          if ($version -ne $raw) {
            throw "Tag $tag does not match Cargo.toml version $raw"
          }
          Write-Host "Tag $tag matches Cargo.toml version $raw"

      # `<lowercase hex>  clip.exe`, the two-space form sha256sum expects.
      - name: Generate SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item target/release/clip.exe clip.exe -Force
          if (-not (Test-Path clip.exe)) { throw 'clip.exe was not built' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path clip.exe).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD\clip.exe.sha256", "$hash  clip.exe")
          Get-Content clip.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $assets = @('clip.exe', 'clip.exe.sha256')
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          } else {
            gh release create $tag @assets --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }

[package]
name = "clip-tauri"
version = "0.1.6"
edition = "2021"
license = "GPL-3.0-or-later"
description = "clip instant-replay recorder (Tauri 2 UI)"

[[bin]]
name = "clip"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clip = { path = ".." }
png = "0.17"
rfd = { version = "0.15", default-features = false, features = ["gtk3", "xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Windowless test modes (--test, --test-audio, ...), excluded from release builds.
devtools = ["clip/devtools"]
